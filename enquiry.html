<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order or Enquire | Custom Cakes &amp; Bulk Orders | Glenda's Bakery</title>
    <meta name="description" content="Request a custom cake, bulk order or catering quote from Glenda's Bakery. We reply within 24 hours.">
    <meta name="keywords" content="custom cake order, bulk bakery order, catering Soweto">
    <meta name="author" content="Gundo Ngwana">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>🍞 Glenda's Bakery</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Our Products</a></li>
                <li><a href="enquiry.html">Order/Enquire</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="page-header">
        <h1>Place Your Order</h1>
        <p>Fill in the form below and we'll get back to you within 24 hours</p>
    </section>

    <section id="enquiry-form">
        <form id="enquiryForm" action="https://jsonplaceholder.typicode.com/posts" method="POST" novalidate>
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <span class="error-message" id="name-error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                <span class="error-message" id="email-error"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. 082 123 4567" required>
                <span class="error-message" id="phone-error"></span>
            </div>

            <div class="form-group">
                <label for="order-type">Type of Order *</label>
                <select id="order-type" name="order-type" required>
                    <option value="">Select an option...</option>
                    <option value="custom-cake">Custom Cake</option>
                    <option value="bulk-order">Bulk Order</option>
                    <option value="wholesale">Wholesale Enquiry</option>
                    <option value="catering">Catering Request</option>
                    <option value="general">General Enquiry</option>
                </select>
                <span class="error-message" id="order-type-error"></span>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity (cakes, items or people)</label>
                <input type="number" id="quantity" name="quantity" min="1" max="1000" placeholder="e.g. 1">
                <span class="form-hint">Not needed for general enquiries.</span>
                <span class="error-message" id="quantity-error"></span>
            </div>

            <div class="form-group">
                <label for="needed-date">Date Needed</label>
                <input type="date" id="needed-date" name="needed-date">
                <span class="form-hint">Not needed for general enquiries.</span>
                <span class="error-message" id="needed-date-error"></span>
            </div>

            <div class="form-group">
                <label for="message">Your Message *</label>
                <textarea id="message" name="message" rows="6" placeholder="Tell us what you're looking for..." required></textarea>
                <span class="error-message" id="message-error"></span>
            </div>

            <button type="submit" class="cta-button">Submit Enquiry</button>
        </form>
        <div id="enquiry-response" class="response-box" hidden></div>
    </section>

    <footer>
        <p>&copy; 2026 Glenda's Bakery. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
